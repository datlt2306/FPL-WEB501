<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <form id="form">
            <div class="mb-3">
                <label for="name" class="form-label">Tên sản phẩm</label>
                <input type="text" class="form-control" id="name" aria-describedby="name">
            </div>
            <div class="mb-3">
                <label for="imageUrl" class="form-label">Ảnh sản phẩm</label>
                <input type="text" class="form-control" id="imageUrl" aria-describedby="imageUrl">
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Giá sản phẩm</label>
                <input type="number" class="form-control" id="price" aria-describedby="price">
            </div>
            <div class="mb-3">
                <label for="quantity" class="form-label">Số lượng sản phẩm</label>
                <input type="number" class="form-control" id="quantity" aria-describedby="quantity">
            </div>
            <div class="mb-3">
                <label for="quantity" class="form-label">Danh mục</label>
                <select name="" id="category" class="form-control">
                    <option value="Áo">Áo</option>
                    <option value="Quần">Quần</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <script>
        const form = document.querySelector('#form');
        const id = new URLSearchParams(window.location.search).get('id');
        const getProduct = async () => {
            const response = await fetch(`http://localhost:3000/products/${id}`);
            const data = await response.json();
            document.querySelector('#name').value = data.name;
            document.querySelector('#price').value = data.price;
            document.querySelector('#quantity').value = data.quantity;
            document.querySelector('#imageUrl').value = data.imageUrl;
            document.querySelector('#category').value = data.category;
        }
        getProduct();


        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.querySelector('#name').value;
            const price = document.querySelector('#price').value;
            const quantity = document.querySelector('#quantity').value;
            const imageUrl = document.querySelector('#imageUrl').value;
            const category = document.querySelector('#category').value;
            if (!name) {
                alert('Vui lòng nhập tên sản phẩm');
                return;
            }
            if (!imageUrl) {
                alert('Vui lòng nhập tên sản phẩm');
                return;
            }
            if (!price) {
                alert('Vui lòng nhập tên sản phẩm');
                return;
            }
            if (!quantity) {
                alert('Vui lòng nhập tên sản phẩm');
                return;
            }
            if (!category) {
                alert('Vui lòng nhập tên sản phẩm');
                return;
            }


            await fetch(`http://localhost:3000/products/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name, price, quantity, imageUrl, category
                })
            });

            console.log('Cập nhật thành công');
            window.location.href = "index.html";
        })
    </script>
</body>

</html>
