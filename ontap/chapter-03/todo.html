<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 flex items-center justify-center p-4">
    <main class="w-full max-w-md">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight mb-2">Todo List</h1>
            <p class="text-slate-400 text-sm">Quản lý công việc của bạn</p>
        </header>

        <div class="bg-white/10 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/20 overflow-hidden">
            <!-- Input thêm todo mới -->
            <form id="todoForm" class="p-4 border-b border-white/10">
                <div class="flex gap-2">
                    <input id="todoInput" type="text" placeholder="Thêm công việc mới..."
                        class="flex-1 px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
                        aria-label="Nhập công việc mới" autocomplete="off">
                    <button type="submit"
                        class="px-5 py-3 bg-purple-500 hover:bg-purple-600 text-white font-medium rounded-xl transition-colors focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-offset-2 focus:ring-offset-slate-900"
                        aria-label="Thêm công việc">
                        Thêm
                    </button>
                </div>
            </form>

            <!-- Danh sách todo -->
            <ul class="divide-y divide-white/10 max-h-96 overflow-y-auto" aria-label="Danh sách công việc">
                <li class="group flex items-center gap-3 p-4 hover:bg-white/5 transition-colors">
                    <input type="checkbox"
                        class="w-5 h-5 rounded border-white/30 bg-white/10 text-purple-500 focus:ring-purple-500 focus:ring-offset-0 cursor-pointer">
                    <span class="flex-1 text-white">Học JavaScript</span>
                    <button type="button"
                        class="opacity-0 group-hover:opacity-100 p-2 text-red-400 hover:text-red-300 hover:bg-red-500/20 rounded-lg transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
                                clip-rule="evenodd" />
                        </svg>
                    </button>
                </li>
                <li class="group flex items-center gap-3 p-4 hover:bg-white/5 transition-colors">
                    <input type="checkbox" checked
                        class="w-5 h-5 rounded border-white/30 bg-white/10 text-purple-500 focus:ring-purple-500 focus:ring-offset-0 cursor-pointer">
                    <span class="flex-1 line-through text-slate-500">Ôn bài biến và hàm</span>
                    <button type="button"
                        class="opacity-0 group-hover:opacity-100 p-2 text-red-400 hover:text-red-300 hover:bg-red-500/20 rounded-lg transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
                                clip-rule="evenodd" />
                        </svg>
                    </button>
                </li>
                <li class="group flex items-center gap-3 p-4 hover:bg-white/5 transition-colors">
                    <input type="checkbox"
                        class="w-5 h-5 rounded border-white/30 bg-white/10 text-purple-500 focus:ring-purple-500 focus:ring-offset-0 cursor-pointer">
                    <span class="flex-1 text-white">Tạo giao diện Todo List</span>
                    <button type="button"
                        class="opacity-0 group-hover:opacity-100 p-2 text-red-400 hover:text-red-300 hover:bg-red-500/20 rounded-lg transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
                                clip-rule="evenodd" />
                        </svg>
                    </button>
                </li>
            </ul>

            <!-- Thống kê -->
            <footer class="p-4 bg-white/5 flex justify-between text-sm text-slate-400">
                <span>2 công việc còn lại</span>
                <button type="button"
                    class="text-purple-400 hover:text-purple-300 transition-colors focus:outline-none focus:underline"
                    aria-label="Xóa các công việc đã hoàn thành">
                    Xóa đã hoàn thành
                </button>
            </footer>
        </div>
    </main>
</body>

</html>
