<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <main class="w-full max-w-md bg-white rounded-xl shadow-lg p-6">
        <header class="text-center mb-4">
            <h1 class="text-2xl font-semibold text-slate-800 mb-1">Todo List</h1>
            <p class="text-slate-500 text-sm">Quản lý công việc hằng ngày của bạn</p>
        </header>

        <section aria-label="Thêm công việc mới" class="mb-4">
            <div class="flex gap-2">
                <input id="todo-input" type="text" placeholder="Nhập công việc mới..."
                    class="flex-1 px-3 py-2 rounded-lg border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    aria-label="Thêm công việc mới" autocomplete="off" />
                <button id="add-button" type="button"
                    class="px-4 py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 disabled:opacity-50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    aria-label="Thêm công việc">
                    Thêm
                </button>
            </div>
        </section>

        <section aria-label="Danh sách công việc">
            <ul id="todo-list" class="space-y-2">
                <!-- Todo items sẽ được render bằng JavaScript -->
            </ul>
        </section>
    </main>

    <script src="todo.js"></script>
</body>

</html>
