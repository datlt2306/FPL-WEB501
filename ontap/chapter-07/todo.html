<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 flex items-center justify-center p-4">
    <main class="w-full max-w-md">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight mb-2">Todo List</h1>
            <p class="text-slate-400 text-sm">Quản lý công việc của bạn</p>
        </header>

        <div class="bg-white/10 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/20 overflow-hidden">
            <!-- Input thêm todo mới -->
            <form id="todoForm" class="p-4 border-b border-white/10">
                <div class="flex gap-2">
                    <input id="todoInput" type="text" placeholder="Thêm công việc mới..."
                        class="flex-1 px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
                        aria-label="Nhập công việc mới" autocomplete="off">
                    <button type="submit"
                        class="px-5 py-3 bg-purple-500 hover:bg-purple-600 text-white font-medium rounded-xl transition-colors focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-offset-2 focus:ring-offset-slate-900"
                        aria-label="Thêm công việc">
                        Thêm
                    </button>
                </div>
            </form>

            <!-- Danh sách todo -->
            <ul id="todos" class=" max-h-96 overflow-y-auto" aria-label="Danh sách công việc">
            </ul>

            <!-- Thống kê -->
            <footer class="p-4 bg-white/5 flex justify-between text-sm text-slate-400">
                <span id="todoStats">0 công việc còn lại</span>
                <button id="clearCompleted" type="button"
                    class="text-purple-400 hover:text-purple-300 transition-colors focus:outline-none focus:underline"
                    aria-label="Xóa các công việc đã hoàn thành">
                    Xóa đã hoàn thành
                </button>
            </footer>
        </div>
    </main>
    <script src="./todo.js"></script>
    <script src="./a" type="module"></script>
</body>

</html>
